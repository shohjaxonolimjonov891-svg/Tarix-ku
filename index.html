<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tarixdan Xulosa - Test</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f7f6;
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
        }
        .quiz-container {
            background: white;
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            max-width: 600px;
            width: 100%;
        }
        h2 { text-align: center; color: #2c3e50; }
        .input-group { margin-bottom: 20px; }
        .input-group label { display: block; margin-bottom: 5px; font-weight: bold; }
        .input-group input { width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 6px; box-sizing: border-box; }
        .question { margin-bottom: 20px; }
        .question h4 { margin-bottom: 10px; color: #34495e; }
        .options label { display: block; padding: 8px 12px; background: #eef2f5; margin-bottom: 6px; border-radius: 6px; cursor: pointer; }
        .options input { margin-right: 10px; }
        button {
            width: 100%;
            padding: 12px;
            background-color: #27ae60;
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 16px;
            cursor: pointer;
            margin-top: 15px;
        }
        button:hover { background-color: #219150; }
        #result { margin-top: 20px; text-align: center; font-size: 18px; font-weight: bold; color: #2c3e50; }
    </style>
</head>
<body>

<div class="quiz-container">
    <h2>📚 Tarixdan Xulosa Testi</h2>
    
    <div class="input-group">
        <label for="studentName">Ism va Familiyangizni kiriting:</label>
        <input type="text" id="studentName" placeholder="Masalan: Shohjaxon Olimjonov">
    </div>

    <!-- Test Savollari -->
    <div class="question">
        <h4>1. Muhammad ibn Muso al-Xorazmiy qaysi ilmiy markazda faoliyat yuritgan?</h4>
        <div class="options">
            <label><input type="radio" name="q1" value="A"> A) Baytul hikma (Bag'dod)</label>
            <label><input type="radio" name="q1" value="B"> B) Marv rasadxonasi</label>
            <label><input type="radio" name="q1" value="C"> C) Ulug'bek madrasasi</label>
        </div>
    </div>

    <div class="question">
        <h4>2. Ahmad Farg'oniy tomonidan yaratilgan mashhur gidrotexnik inshoot qaysi?</h4>
        <div class="options">
            <label><input type="radio" name="q2" value="A"> A) Nilomer (Meqyos an-Nil)</label>
            <label><input type="radio" name="q2" value="B"> B) Bandi amir</label>
            <label><input type="radio" name="q2" value="C"> C) Karvin kanali</label>
        </div>
    </div>

    <button onclick="submitQuiz()">Natijani Yuborish</button>

    <div id="result"></div>
</div>

<script>
// To'g'ri javoblar kaliti
const correctAnswers = {
    q1: "A",
    q2: "A"
};

function submitQuiz() {
    const studentName = document.getElementById("studentName").value.trim();
    if (!studentName) {
        alert("Iltimos, ism va familiyangizni kiriting!");
        return;
    }

    let score = 0;
    const totalQuestions = Object.keys(correctAnswers).length;

    for (let key in correctAnswers) {
        const selected = document.querySelector(`input[name="${key}"]:checked`);
        if (selected && selected.value === correctAnswers[key]) {
            score++;
        }
    }

    document.getElementById("result").innerText = `Sizning natijangiz: ${score} / ${totalQuestions}`;

    // Telegram Botga natijani yuborish
    sendResultsToTelegram(studentName, score, totalQuestions);
}

function sendResultsToTelegram(studentName, score, totalQuestions) {
    // BotFather'dan olgan to'liq tokeningizni kiriting (nuqtalarsiz):
    const token = '8864127573:AAFNUjjRZaHPXDrjFCr9fQwZ7...'; 
    const chatId = '7638021708';

    const message = `📚 *Tarixdan Xulosa — Yangi natija!*\n\n` +
                    `👤 *O'quvchi:* ${studentName}\n` +
                    `📊 *Natija:* ${score} / ${totalQuestions}\n` +
                    `⏰ *Vaqt:* ${new Date().toLocaleString('uz-UZ')}`;

    fetch(`https://api.telegram.org/bot${token}/sendMessage`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
            chat_id: chatId,
            text: message,
            parse_mode: 'Markdown'
        })
    })
    .then(response => {
        if(response.ok) {
            alert("Natijangiz ustozga yuborildi!");
        } else {
            alert("Xatolik yuz berdi. Bot ma'lumotlarini tekshiring.");
        }
    })
    .catch(err => console.error('Xatolik:', err));
}
</script>

</body>
</html>

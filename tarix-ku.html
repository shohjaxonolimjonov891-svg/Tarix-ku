<!DOCTYPE html>
<html lang="uz">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#0F172A" />
  <meta name="author" content="Olimjonov Shohjaxon" />
  <meta name="copyright" content="© 2026 Olimjonov Shohjaxon. Barcha huquqlar himoyalangan." />
  <title>Tarix-ku · DTM va Milliy sertifikat</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            ink: '#0F172A',
            gold: '#F59E0B',
            paper: '#F8FAFC'
          }
        }
      }
    }
  </script>
  <style>
    :root { color-scheme: light; }
    body { font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif; }
    .no-scrollbar::-webkit-scrollbar { display: none; }
    .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    .scene { perspective: 1400px; }
    .card3d {
      transform-style: preserve-3d;
      transition: transform 0.55s cubic-bezier(0.22, 1, 0.36, 1);
    }
    .card3d.is-flipped { transform: rotateY(180deg); }
    .face {
      backface-visibility: hidden;
      -webkit-backface-visibility: hidden;
    }
    .face-back { transform: rotateY(180deg); }
  </style>
</head>
<body class="bg-paper text-ink min-h-screen">
  <header class="sticky top-0 z-40 bg-ink text-white px-4 py-4 shadow-lg">
    <div class="max-w-3xl mx-auto flex items-center justify-between gap-3">
      <div>
        <p class="text-[10px] uppercase tracking-[0.22em] text-gold">Milliy sertifikat · DTM</p>
        <h1 class="text-xl font-bold leading-tight">Tarix-ku</h1>
      </div>
      <p class="text-[10px] text-right text-slate-300 leading-snug">
        Muallif<br /><span class="text-gold font-semibold">Olimjonov Shohjaxon</span>
      </p>
    </div>
    <nav class="max-w-3xl mx-auto mt-3 grid grid-cols-3 gap-2 text-sm">
      <button data-tab="cards" class="tab-btn rounded-xl bg-gold text-ink font-semibold py-2">Kartalar</button>
      <button data-tab="line" class="tab-btn rounded-xl bg-white/10 py-2">Vaqt o‘qi</button>
      <button data-tab="list" class="tab-btn rounded-xl bg-white/10 py-2">Ro‘yxat</button>
    </nav>
  </header>

  <main class="max-w-3xl mx-auto px-4 py-6 pb-24">
    <section id="tab-cards">
      <p class="text-center text-xs text-slate-500 mb-3" id="card-meta"></p>
      <button id="flip-btn" class="scene block w-full" type="button" aria-label="Kartani aylantirish">
        <div id="card3d" class="card3d relative h-80 w-full">
          <article class="face absolute inset-0 rounded-3xl border border-slate-200 bg-white p-5 shadow-xl flex flex-col justify-between text-left">
            <div>
              <span id="f-cat" class="inline-block rounded-full px-3 py-1 text-xs font-semibold bg-amber-100 text-amber-800"></span>
              <p id="f-year" class="mt-4 text-sm font-semibold text-gold"></p>
              <h2 id="f-title" class="mt-1 text-2xl font-bold leading-snug"></h2>
              <p id="f-period" class="mt-2 text-sm text-slate-500"></p>
            </div>
            <p class="text-center text-xs text-slate-400">Bosib orqa tomonni oching</p>
          </article>
          <article class="face face-back absolute inset-0 rounded-3xl bg-ink p-5 shadow-xl flex flex-col justify-between text-left text-white">
            <div>
              <p class="text-xs uppercase tracking-wide text-gold">Voqea</p>
              <p id="b-desc" class="mt-2 text-sm leading-relaxed text-slate-100"></p>
            </div>
            <div class="rounded-2xl bg-amber-500/15 p-3">
              <p class="text-[11px] font-semibold uppercase tracking-wide text-gold">Imtihon eslatmasi</p>
              <p id="b-note" class="mt-1 text-sm leading-relaxed text-amber-50"></p>
            </div>
          </article>
        </div>
      </button>
      <div class="mt-4 grid grid-cols-2 gap-3">
        <button id="btn-again" class="rounded-2xl bg-red-600 text-white font-semibold py-3 shadow active:scale-[0.98]">Qayta takrorlash</button>
        <button id="btn-know" class="rounded-2xl bg-emerald-600 text-white font-semibold py-3 shadow active:scale-[0.98]">Bildim</button>
      </div>
    </section>

    <section id="tab-line" class="hidden">
      <p class="text-sm text-slate-500 mb-4">Nuqtani bosing — qisqa fakt ochiladi.</p>
      <div class="no-scrollbar overflow-x-auto -mx-4 px-4">
        <div class="relative flex min-w-max items-start gap-8 pt-6 pb-2" id="timeline"></div>
      </div>
    </section>

    <section id="tab-list" class="hidden space-y-3" id="list"></section>
  </main>

  <div id="modal" class="hidden fixed inset-0 z-50 flex items-end sm:items-center justify-center bg-slate-900/50 p-4">
    <article class="w-full max-w-md rounded-3xl bg-paper p-5 shadow-2xl">
      <p id="m-year" class="text-sm font-semibold text-gold"></p>
      <h3 id="m-title" class="mt-1 text-xl font-bold"></h3>
      <p id="m-meta" class="mt-1 text-xs text-slate-500"></p>
      <p id="m-desc" class="mt-3 text-sm leading-relaxed text-slate-700"></p>
      <div class="mt-4 rounded-2xl border border-amber-200 bg-amber-50 p-3">
        <p class="text-[11px] font-semibold uppercase tracking-wide text-amber-700">Imtihon eslatmasi</p>
        <p id="m-note" class="mt-1 text-sm text-slate-800"></p>
      </div>
      <button id="m-close" class="mt-4 w-full rounded-2xl bg-ink py-3 text-sm font-semibold text-white">Yopish</button>
    </article>
  </div>

  <footer class="px-4 pb-8 text-center text-[11px] text-slate-500">
    © 2026 Olimjonov Shohjaxon · Tarix-ku. Nusxa ko‘chirish muallif ruxsatisiz taqiqlanadi.
  </footer>

  <script>
    const ITEMS = [
      {
        id: "teshik-tosh",
        year: "100–40 ming y.avval",
        title: "Teshik-Tosh neandertali",
        description: "Boysun tog‘laridagi Teshik-Tosh g‘oridan Neandertal bola skeleti va 5 qator echkito‘ra shoxlari topilgan.",
        category: "Madaniyat",
        examNote: "1938–39, A.P. Okladnikov. O‘zbekiston dasturida Neandertal deb o‘rgatiladi.",
        period: "O‘rta paleolit"
      },
      {
        id: "sopollitepa",
        year: "mil.av. XXII–XVII asr",
        title: "Sopollitepa",
        description: "Surxondaryo (Sherobod) bronza davri shahar-yodgorligi: mudofaa devori, ibodatxona, hunarmandchilik.",
        category: "Madaniyat",
        examNote: "Sopollitepa va Jarqo‘ton — BMAC / Oks sivilizatsiyasi doirasida.",
        period: "Bronza davri"
      },
      {
        id: "ahmoniylar",
        year: "mil.av. 550–330",
        title: "Ahamoniylar satrapligi",
        description: "Kir II asos solgan. Baqtriya, So‘g‘d, Xorazm, Farg‘ona satraplikka aylangan.",
        category: "Islohot",
        examNote: "Doro I davrida 20 ga yaqin satraplik. Behistunda Frada qo‘zg‘oloni qayd etilgan.",
        period: "Ahamoniylar"
      },
      {
        id: "spitamen",
        year: "mil.av. 329–327",
        title: "Iskandar va Spitamen",
        description: "Iskandar Amudaryodan o‘tib Baqtriya va So‘g‘dga kirgan. Spitamen ikki yillik partizan urushi olib borgan.",
        category: "Urush",
        examNote: "Iskandariya Eshata — Xo‘jand yaqinida. Marokanda = Samarqand.",
        period: "Makedon yurishi"
      },
      {
        id: "kanishka",
        year: "II asr",
        title: "Kanishka I",
        description: "Kushon saltanati cho‘qqisi, buddizm homiysi. Termiz, Fayoztepa, Qoratepa shu davr yodgorliklari.",
        category: "Hukmdor",
        examNote: "Kanishka odatda 127-yildan deb o‘rgatiladi. Kelib chiqishi — Yuechji guyshuan urug‘i.",
        period: "Kushonlar"
      },
      {
        id: "qutayba",
        year: "705–715",
        title: "Qutayba ibn Muslim",
        description: "Movarounnahrni tizimli zabt etgan Umaviy sarkarda: Buxoro 709, Samarqand 712, Xorazm 712.",
        category: "Urush",
        examNote: "715-yilda Farg‘ona yo‘lida o‘z askarlari fitnasida o‘ldirilgan.",
        period: "Arab istilosi"
      },
      {
        id: "talos",
        year: "751",
        title: "Talos jangi",
        description: "Abbosiy–qarluq ittifoqi Tan Xitoyini mag‘lub etgan. Qog‘oz texnologiyasi g‘arbga o‘tgan.",
        category: "Urush",
        examNote: "Arablar (Ziyod ibn Solih) va qarluqlar — Gao Syanchji ustidan g‘alaba.",
        period: "Abbosiylar"
      },
      {
        id: "ismoil",
        year: "892–907",
        title: "Ismoil Somoniy",
        description: "Somoniylarni birlashtirgan. 900-yil Amr ibn Laysni mag‘lub etgan, Buxoroni poytaxt qilgan.",
        category: "Hukmdor",
        examNote: "875 — Nasr I noibligi; 892 — Ismoil yakka hokimiyat; 999 — Buxoro Qoraxoniylarga o‘tgan.",
        period: "Somoniylar"
      },
      {
        id: "buxoro-999",
        year: "999",
        title: "Qoraxoniylar Buxoroni olgan",
        description: "Ilikxon Nosir ibn Ali Somoniylar hukmronligiga Movarounnahrda barham bergan.",
        category: "Urush",
        examNote: "Satuk Bug‘roxon — islomni qabul qilgan ilk yirik turk xoqoni (Kashg‘ar, 940-lar).",
        period: "Qoraxoniylar"
      },
      {
        id: "qatvon",
        year: "1141",
        title: "Qatvon jangi",
        description: "Qoraxitoy g‘urxoni Yeluy Dashi Saljuqiy Sanjar va Qoraxoniyni mag‘lub etgan.",
        category: "Urush",
        examNote: "Musulmon sulton buddist-qidan g‘urxondan yengilgan. Mahalliy sulolalar o‘lpon tizimida qolgan.",
        period: "Qoraxitoylar"
      },
      {
        id: "otroq",
        year: "1218",
        title: "O‘troq voqeasi",
        description: "Xorazmshoh noibi Inolchiq mo‘g‘ul savdo karvonini qirg‘in qilgan — urush bahonasi.",
        category: "Urush",
        examNote: "1219–1221 Chingizxon yurishi. Jaloliddin Manguberdi — milliy qarshilik ramzi.",
        period: "Xorazmshohlar"
      },
      {
        id: "temur-1370",
        year: "1370",
        title: "Balx qurultoyi: Amir Temur",
        description: "1365 Loy jangidan so‘ng Temur va Husayn kurashi. 1370 Balxda Temur hokimiyatni olgan.",
        category: "Hukmdor",
        examNote: "Chig‘atoy ulusi oxiri — amirlar davri. Keyingi jild: Temuriylar.",
        period: "Chig‘atoy ulusi"
      }
    ];

    const catClass = {
      Hukmdor: "bg-amber-100 text-amber-800",
      Urush: "bg-rose-100 text-rose-800",
      Madaniyat: "bg-sky-100 text-sky-800",
      Islohot: "bg-emerald-100 text-emerald-800"
    };

    let index = 0;
    let flipped = false;
    let unknown = 0;

    const $ = (id) => document.getElementById(id);

    function renderCard() {
      const item = ITEMS[index];
      $("card-meta").textContent = `${index + 1} / ${ITEMS.length}` + (unknown ? ` · qayta: ${unknown}` : "");
      $("f-cat").className = "inline-block rounded-full px-3 py-1 text-xs font-semibold " + catClass[item.category];
      $("f-cat").textContent = item.category;
      $("f-year").textContent = item.year;
      $("f-title").textContent = item.title;
      $("f-period").textContent = item.period;
      $("b-desc").textContent = item.description;
      $("b-note").textContent = item.examNote;
      flipped = false;
      $("card3d").classList.remove("is-flipped");
    }

    function next() {
      index = (index + 1) % ITEMS.length;
      renderCard();
    }

    $("flip-btn").addEventListener("click", () => {
      flipped = !flipped;
      $("card3d").classList.toggle("is-flipped", flipped);
    });
    $("btn-again").addEventListener("click", () => { unknown += 1; next(); });
    $("btn-know").addEventListener("click", next);

    function openModal(item) {
      $("m-year").textContent = item.year;
      $("m-title").textContent = item.title;
      $("m-meta").textContent = item.period + " · " + item.category;
      $("m-desc").textContent = item.description;
      $("m-note").textContent = item.examNote;
      $("modal").classList.remove("hidden");
    }
    $("m-close").addEventListener("click", () => $("modal").classList.add("hidden"));
    $("modal").addEventListener("click", (e) => {
      if (e.target.id === "modal") $("modal").classList.add("hidden");
    });

    const line = $("timeline");
    line.innerHTML = '<div class="absolute left-0 right-0 top-[52px] h-0.5 bg-gold"></div>' +
      ITEMS.map((item) => `
        <button type="button" data-id="${item.id}" class="tl-dot relative z-10 flex w-36 shrink-0 flex-col items-center text-center">
          <span class="mb-3 text-[11px] font-semibold text-amber-700">${item.year}</span>
          <span class="h-4 w-4 rounded-full border-4 border-gold bg-ink shadow"></span>
          <span class="mt-3 line-clamp-2 text-sm font-medium">${item.title}</span>
        </button>
      `).join("");
    line.querySelectorAll(".tl-dot").forEach((btn) => {
      btn.addEventListener("click", () => {
        openModal(ITEMS.find((x) => x.id === btn.dataset.id));
      });
    });

    const listRoot = document.getElementById("tab-list");
    listRoot.innerHTML = ITEMS.map((item) => `
      <button type="button" data-id="${item.id}" class="list-item w-full text-left rounded-2xl bg-white border border-slate-200 p-4 shadow-sm">
        <div class="flex items-center justify-between gap-2">
          <span class="text-xs font-semibold text-gold">${item.year}</span>
          <span class="text-[10px] rounded-full px-2 py-0.5 ${catClass[item.category]}">${item.category}</span>
        </div>
        <p class="mt-1 font-bold">${item.title}</p>
        <p class="mt-1 text-xs text-slate-500">${item.period}</p>
      </button>
    `).join("");
    listRoot.querySelectorAll(".list-item").forEach((btn) => {
      btn.addEventListener("click", () => openModal(ITEMS.find((x) => x.id === btn.dataset.id)));
    });

    const tabs = {
      cards: $("tab-cards"),
      line: $("tab-line"),
      list: $("tab-list")
    };
    document.querySelectorAll(".tab-btn").forEach((btn) => {
      btn.addEventListener("click", () => {
        document.querySelectorAll(".tab-btn").forEach((b) => {
          b.className = "tab-btn rounded-xl bg-white/10 py-2";
        });
        btn.className = "tab-btn rounded-xl bg-gold text-ink font-semibold py-2";
        Object.keys(tabs).forEach((k) => tabs[k].classList.add("hidden"));
        tabs[btn.dataset.tab].classList.remove("hidden");
      });
    });

    renderCard();
  </script>
</body>
</html>
